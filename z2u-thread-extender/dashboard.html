<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z2U Batch Sort</title>
    <style>
        :root {
            --z2u-red: #da251c;
            --dark-bg: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --success: #4caf50;
            --info: #2196f3;
            --warning: #ff9800;
        }

        body {
            width: 450px;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--z2u-red);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--z2u-red);
        }

        .status-badge {
            background-color: var(--success);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-clear {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid #444;
        }

        .btn-refresh {
            background-color: var(--z2u-red);
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .log-container {
            max-height: 400px;
            overflow-y: auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #444;
        }

        .log-item {
            padding: 8px;
            border-bottom: 1px solid #3d3d3d;
            font-size: 0.85rem;
            animation: slideIn 0.3s ease-out;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--text-secondary);
            font-family: monospace;
            margin-right: 8px;
            font-size: 0.75rem;
        }

        .log-msg {
            word-wrap: break-word;
        }

        .type-success {
            border-left: 3px solid var(--success);
        }

        .type-info {
            border-left: 3px solid var(--info);
        }

        .type-warning {
            border-left: 3px solid var(--warning);
        }

        .type-process {
            border-left: 3px solid var(--text-secondary);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--z2u-red);
        }

        @keyframes slideIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .empty-log {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>Z2U Batch Sort</h2>
        <div class="status-badge">Active</div>
    </div>

    <div class="controls">
        <button class="btn-refresh" id="refreshBtn">Refresh Logs</button>
        <button class="btn-clear" id="clearBtn">Clear History</button>
    </div>

    <div style="margin-bottom: 15px;">
        <button id="launchWorker"
            style="background: linear-gradient(to right, #da251c, #9b1d16); color: white; width: 100%; padding: 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(218, 37, 28, 0.3);">🚀
            Launch Satellite (Batch Sort)</button>
        <p style="font-size: 10px; color: #888; text-align: center; margin-top: 5px;">Opens a mini worker that runs Batch Sort and auto-closes.</p>
    </div>

    <div
        style="margin-bottom: 15px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid #444;">
        <label
            style="font-size: 10px; text-transform: uppercase; color: #888; display: block; margin-bottom: 5px;">Admin
            Panel Sync (Password)</label>
        <div style="display: flex; gap: 5px;">
            <input type="password" id="adminPass" placeholder="Enter Admin Password"
                style="flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 4px; font-size: 12px;">
            <button id="savePassBtn"
                style="flex: 0; white-space: nowrap; font-size: 10px; background: #444; padding: 5px 10px;">Save
                Keys</button>
        </div>
        <p style="font-size: 9px; color: var(--text-secondary); margin-top: 5px;">Syncs Batch Sort activity to OfficialUM1 Admin Panel.</p>
    </div>

    <div class="log-container" id="logContainer">
        <div class="empty-log">Looking for logs...</div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
