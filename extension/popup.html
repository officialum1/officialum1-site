<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header {
            background: linear-gradient(135deg, #ff0055, #ff00aa);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
        }

        .content {
            padding: 1.5rem;
        }

        .status-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .status-site {
            color: #00c3ff;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 0.5rem;
        }

        .btn-primary {
            background: #00ff88;
            color: #000;
        }

        .btn-primary:disabled {
            background: #222;
            color: #444;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #333;
            color: #888;
        }

        .footer {
            font-size: 0.7rem;
            color: #444;
            text-align: center;
            padding-bottom: 1rem;
        }

        .progress-log {
            height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.7rem;
            background: #000;
            padding: 5px;
            border-radius: 5px;
            color: #00ff88;
            display: none;
        }
    </style>
</head>

<body>
    <div class="header">OFFICIALUM1 SYNC</div>
    <div class="content">
        <div class="status-card">
            <div style="font-size: 0.75rem; color: #555; margin-bottom: 5px;">CURRENT SITE</div>
            <div id="active-site" class="status-site">Detecting...</div>
        </div>

        <button id="sync-btn" class="btn btn-primary" disabled>⚡ START SYNC</button>
        <button id="open-dash" class="btn btn-outline">🏠 OPEN DASHBOARD</button>

        <div id="log" class="progress-log"></div>
    </div>
    <div class="footer">v1.0 - OfficialUM1 Ecosystem</div>

    <script src="popup.js"></script>
</body>

</html>
