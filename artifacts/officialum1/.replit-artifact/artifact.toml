kind = "web"
previewPath = "/"
title = "OfficialUM1"
version = "1.0.0"
id = "artifacts/officialum1"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20608

[services.development]
run = "pnpm --filter @workspace/officialum1 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/officialum1", "run", "build" ]
publicDir = "artifacts/officialum1/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20608"
BASE_PATH = "/"
